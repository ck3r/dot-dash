<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1c1916">
  <meta name="robots" content="noindex">
  <title>429 · dot-da.sh</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/switch.svg">
  <!-- every path from the root: served in place of whatever was asked for -->
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/tx/tx.css">
  <script type="module" src="/js/skeleton.js"></script>
</head>
<body class="tx signal">

  <!--
    429: the station's skeleton keys the answer over and over (made by
    tests/tools/errors.py; 404.html is the one GitHub Pages serves, the
    rest are for the Worker to serve in place of an error):

      &lt;HH&gt; 429 QRS   (error, 429, send slower)
  -->
  <div class="aux-page aux-error">
    <header class="tx-top">
      <a href="/" class="home">dot-da.sh</a>
      <div class="top-right"><span class="profile" title="profiles: coming soon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3.2"/><path d="M6.4 18.6c1.3-2.2 3.3-3.4 5.6-3.4s4.3 1.2 5.6 3.4"/></svg></span></div>
    </header>
    <main class="station aux-station">
      <a href="/" class="logo switch" aria-label="back to the station" title="back to the station">
        <svg viewBox="0 0 73 79" fill="none">
          <circle cx="13.66" cy="52.81" r="7" stroke="currentColor" stroke-width="6"/>
          <rect class="arm" x="16.02" y="47.22" width="56" height="7" rx="3.5" fill="currentColor"/>
          <circle class="led" cx="13.66" cy="52.81" r="3.6"/>
        </svg>
      </a>
      <div class="aux-field"><span class="aux-line" data-morse="........ / ....- ..--- ----. / --.- .-. ..." data-names="&lt;HH&gt; 4 2 9 Q R S" role="img" aria-label="&lt;HH&gt; 429 QRS in Morse: error, 429, send slower"></span></div>
    </main>
    <section class="aux-note">
      <h1>error 429</h1>
      <p>Too many at once. Send slower, and try again in a moment.</p>
      <p class="aux-links"><a href="/">back to the station</a> · <a href="/ref/">the reference</a></p>
    </section>
  </div>

</body>
</html>
