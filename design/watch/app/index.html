<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>watch app · dot-da.sh</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/switch.svg">

  <script>try { if (localStorage.getItem("dot-dash:theme") === "light") document.documentElement.classList.add("light"); } catch { }</script>
  <link rel="stylesheet" href="/css/base.css">

  <style>
    /*
     * A sheet for the Garmin app (docs/garmin.md, js/design/watch-app.js):
     * a watch, its five buttons, a round screen, the app's screens
     * working. Press the drawn buttons, or the keyboard: the arrows
     * for UP and DOWN, Enter for START, Escape for BACK, L for LIGHT.
     * Not linked from anywhere yet.
     */
    .sheet { padding: 1.5rem 16px; max-width: 64rem; margin: 0 auto; }
    .sheet h1 { font-size: 1.05rem; font-weight: 700; }
    .sheet > p { margin-top: 0.5rem; color: var(--graphite); }
    .bench { display: flex; flex-wrap: wrap; gap: 1.5rem 2.5rem; align-items: flex-start; margin-top: 1.25rem; }

    /* the panel, as on the faces sheet */
    .controls { display: flex; flex-direction: column; gap: 0.5rem; min-width: 15rem; }
    .controls fieldset {
      border: 1px solid var(--wire); padding: 0.25rem 0.75rem 0.6rem; margin: 0; min-width: 0;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.25ch;
    }
    .controls legend { color: var(--graphite); font-size: 0.8rem; padding: 0 0.5ch; }
    .controls select, .controls button {
      font: inherit; color: var(--graphite); background: none;
      border: 1px solid var(--wire); padding: 0.25rem 1ch; cursor: pointer;
    }
    .controls select option { background: var(--bakelite); }
    .controls label { color: var(--graphite); display: inline-flex; gap: 0.5ch; align-items: center; cursor: pointer; }
    .controls input[type="checkbox"] { accent-color: var(--brass); }
    .controls :is(button, select):focus-visible { color: var(--brass); border-color: var(--brass); outline: none; }
    @media (hover: hover) { .controls :is(button, select):hover, .controls label:hover { color: var(--brass); border-color: var(--brass); } }
    .controls .keys { color: var(--graphite); font-size: 0.8rem; line-height: 1.6; }
    .controls .keys b { color: var(--paper); font-weight: 400; }

    /* the watch: a case, the round screen in it, five buttons on its
       edge where a fēnix has them */
    .watch { position: relative; width: 320px; height: 320px; flex: none; margin: 0 auto; touch-action: none; user-select: none; }
    /* on a narrow phone, the watch smaller, so the page doesn't scroll sideways */
    @media (max-width: 360px) { .watch { zoom: 0.85; } }
    .case { position: absolute; inset: 20px; border-radius: 50%; border: 2px solid var(--wire); background: var(--bakelite); }
    .screen {
      position: absolute; left: 40px; top: 40px; width: 240px; height: 240px; border-radius: 50%; overflow: hidden;
      background: var(--bakelite); box-shadow: inset 0 0 0 1px var(--wire);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px;
      font-family: var(--mono); color: var(--graphite);
    }
    .hw {
      position: absolute; left: 160px; top: 160px; width: 30px; height: 12px; margin: -6px 0 0 -15px; padding: 0;
      border: 1px solid var(--wire); border-radius: 4px; background: var(--bakelite); cursor: pointer;
      transform: rotate(var(--a)) translateY(-153px);
    }
    .hw.down { background: var(--brass); border-color: var(--brass); }
    @media (hover: hover) { .hw:hover { border-color: var(--brass); } }
    .hw-label { position: absolute; font-size: 0.7rem; color: var(--graphite); transform: translate(-50%, -50%); pointer-events: none; }

    /* the outputs, shown: the case shakes for a buzz, the screen lights */
    .watch.buzz .case { animation: buzz 60ms linear infinite; }
    @keyframes buzz { 0% { transform: translate(0.8px, 0); } 50% { transform: translate(-0.8px, 0.4px); } 100% { transform: translate(0.8px, 0); } }
    @media (prefers-reduced-motion: reduce) { .watch.buzz .case { animation: none; border-color: var(--brass); } }
    .screen::after { content: ""; position: absolute; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; }
    .screen.lit::after { opacity: 0.9; }

    /* the screens */
    .screen .title { position: absolute; top: 22px; left: 0; right: 0; font-size: 11px; color: var(--graphite); }
    .screen .hint { font-size: 11px; color: var(--graphite); }
    .screen .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .screen .list li { font-size: 12px; min-height: 16px; color: var(--graphite); cursor: default; }
    .screen .list li.chosen { font-size: 20px; color: var(--paper); }
    .screen .list .group { display: block; font-size: 9px; color: var(--brass); letter-spacing: 0.08em; text-transform: uppercase; }
    .screen .marks { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 12px; flex-wrap: wrap; max-width: 180px; }
    .screen .marks i { display: block; height: 6px; background: var(--dash); }
    .screen .marks i.dot { width: 6px; background: var(--dot); }
    .screen .marks i.dash { width: 18px; }
    .screen .marks b { width: 8px; }
    .screen .marks b.w { width: 16px; }
    .screen .marks i.now { background: var(--brass); }
    .screen .marks.big i { height: 10px; }
    .screen .marks.big i.dot { width: 10px; }
    .screen .marks.big i.dash { width: 30px; }
    .screen .marks.wrong i { background: var(--brass); }
    .screen .sent { font-size: 20px; color: var(--paper); max-width: 190px; white-space: pre; overflow: hidden; }
    .screen .halves { position: absolute; left: 50%; top: 18%; bottom: 18%; border-left: 1px dashed var(--wire); }
    .screen .clock { font-size: 40px; color: var(--paper); }

    .screen .grid { position: absolute; inset: 0; width: 100%; height: 100%; }
    .grid .line { stroke: var(--wire); stroke-width: 1.2; }
    .grid .mark { fill: var(--wire); }
    .grid .on .line { stroke: var(--paper); stroke-width: 2; }
    .grid .on .mark.dot { fill: var(--dot); }
    .grid .on .mark.dash { fill: var(--dash); }
    .grid .place circle { fill: var(--bakelite); }
    .grid .place text { fill: var(--graphite); font-family: var(--mono); font-size: 10px; }
    .grid .place.on text { fill: var(--paper); font-weight: 700; }
    .grid .place.here circle, .grid .root.here { stroke: var(--brass); stroke-width: 1.5; }
    .grid .root { fill: var(--bakelite); stroke: var(--paper); stroke-width: 1.5; }
    .screen .where { position: absolute; bottom: 24px; left: 0; right: 0; font-size: 11px; color: var(--paper); }

    .screen .card { display: flex; align-items: center; gap: 14px; }
    .screen .pic svg { width: 86px; height: 86px; display: block; }
    .screen .char { font-size: 60px; color: var(--paper); }
    .screen .name { font-size: 11px; }
    .screen .target { font-size: 48px; color: var(--paper); line-height: 1; }

    /* station: the draft over its list; sending, the letter going out lit */
    .screen .draft { font-size: 13px; color: var(--paper); max-width: 170px; white-space: pre; overflow: hidden; border-bottom: 1px solid var(--wire); padding-bottom: 3px; }
    .screen .tx { font-size: 22px; color: var(--graphite); max-width: 190px; word-break: break-all; white-space: pre-wrap; }
    .screen .tx span.now { color: var(--brass); }

    /* copy: three to choose from */
    .screen .choices { list-style: none; margin: 0; padding: 0; display: flex; gap: 18px; font-size: 28px; }
    .screen .choices li { color: var(--graphite); padding: 0 6px; border-bottom: 2px solid transparent; }
    .screen .choices li.chosen { color: var(--paper); border-bottom-color: var(--brass); }
    .screen .choices li.answer { color: var(--brass); }

    /* the game: the ground, the runner (the key's disc), hurdles and beams */
    .screen .game { position: absolute; inset: 0; width: 100%; height: 100%; }
    .game .ground { stroke: var(--wire); stroke-width: 1.5; }
    .game .runner circle { fill: var(--paper); }
    .game .ob.dot { fill: var(--dot); }
    .game .ob.dash { fill: var(--dash); }
    .game .ob.hit { fill: var(--wire); }
    .game .coming { fill: var(--paper); font-family: var(--mono); font-size: 40px; }
    .game .score { fill: var(--graphite); font-family: var(--mono); font-size: 11px; }

    /* the name as a stair (js/core/stair.js), as on the card */
    .screen .stair { display: block; position: relative; width: 70px; height: calc(var(--h) * 1em); font-size: 13px; }
    .screen .stair.small { font-size: 10px; width: 100%; }
    .screen .stair > * { position: absolute; left: calc(50% + var(--dx) * 0.72em); top: calc(var(--y) * 1em); transform: translateX(-50%); line-height: 1; }
    .screen .stair .stress { color: var(--paper); font-weight: 700; }

    /* the stroke letters' three layers, as on /design/strokes/ */
    .stroked path { fill: none; }
    .stroked .scaffold path { stroke: var(--graphite); stroke-width: 1.5; }
    .stroked .ink path { fill: none; stroke: var(--paper); stroke-width: 1.5; }
    .stroked .grey path { stroke: var(--wire); }
    .stroked .fill .dot { stroke: var(--dot); }
    .stroked .fill .dash { stroke: var(--dash); }
  </style>
</head>

<body>
  <main class="sheet">
    <h1>watch app</h1>
    <p>The Garmin app, drawn here first: a station (write, then send), the reference, practice and a game, on a watch with five buttons, each working. Press the buttons, or use the keyboard.</p>

    <div class="bench">
      <div class="watch" id="watch">
        <div class="case"></div>
        <div class="screen" id="screen"></div>
      </div>

      <div class="controls">
        <fieldset>
          <legend>watch</legend>
          <select id="device" aria-label="buttons only, or a touch screen as well">
            <option value="buttons" selected>buttons only</option>
            <option value="touch">touch screen too</option>
          </select>
          <button id="home">menu</button>
        </fieldset>
        <fieldset>
          <legend>key</legend>
          <select id="keytype" aria-label="paddles or a straight key">
            <option value="paddles" selected>paddles</option>
            <option value="straight">straight key</option>
          </select>
          <select id="wpm" aria-label="speed">
            <option value="8">8 wpm</option>
            <option value="12" selected>12 wpm</option>
            <option value="18">18 wpm</option>
          </select>
        </fieldset>
        <fieldset>
          <legend>outputs</legend>
          <label><input type="checkbox" id="o-sound" checked> sound</label>
          <label><input type="checkbox" id="o-buzz" checked> buzz</label>
          <label><input type="checkbox" id="o-flash"> flash</label>
        </fieldset>
        <fieldset>
          <legend>keyboard</legend>
          <div class="keys"><b>↑ ↓</b> UP DOWN · <b>Enter</b> START · <b>Esc</b> BACK · <b>L</b> LIGHT</div>
        </fieldset>
        <fieldset>
          <legend>screen</legend>
          <button id="theme">invert</button>
        </fieldset>
      </div>
    </div>
  </main>

  <script type="module">
    import { createApp } from "/js/design/watch-app.js";

    const $ = id => document.getElementById(id);
    const watch = $("watch");

    /* the five buttons where a fēnix has them, clockwise from twelve
       (degrees), each with its name outside */
    const BUTTONS = [["light", "LIGHT", -60], ["up", "UP", -90], ["down", "DOWN", -120], ["start", "START", 60], ["back", "BACK", 120]];
    for (const [id, label, a] of BUTTONS) {
      const b = document.createElement("button");
      b.className = "hw";
      b.dataset.button = id;
      b.setAttribute("aria-label", label);
      b.style.setProperty("--a", `${a}deg`);
      watch.append(b);
      const t = document.createElement("span");
      t.className = "hw-label";
      t.textContent = label;
      const r = 177, rad = a * Math.PI / 180;
      t.style.left = `${160 + r * Math.sin(rad)}px`;
      t.style.top = `${160 - r * Math.cos(rad)}px`;
      watch.append(t);
    }

    const options = () => ({
      touch: $("device").value === "touch",
      straight: $("keytype").value === "straight",
      wpm: +$("wpm").value,
      sound: $("o-sound").checked, buzz: $("o-buzz").checked, flash: $("o-flash").checked,
    });
    const app = createApp({ watch, screen: $("screen"), options });
    window.app = app;   // for the checks

    for (const id of ["device", "keytype"]) $(id).addEventListener("change", () => app.redraw());
    $("home").addEventListener("click", () => app.home());
    $("theme").addEventListener("click", () => document.documentElement.classList.toggle("light"));
  </script>
</body>
</html>
